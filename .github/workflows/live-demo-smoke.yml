name: Live agenda workflow check

on:
  push:
    branches:
      - qa/demo-live-check-20260921

jobs:
  agenda-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check public demo navigation and organization agenda
        env:
          BASE_URL: https://sportmatch-zzp.vercel.app
        run: |
          cat > live-agenda-check.mjs <<'EOF'
          import { chromium } from "@playwright/test";

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext();
          const page = await context.newPage();
          const baseURL = process.env.BASE_URL;

          try {
            await page.goto(baseURL + "/", { waitUntil: "networkidle", timeout: 45000 });
            const header = page.locator("header");
            const exactDemoLinks = header.getByRole("link", { name: /^Demo$/ });
            if (await exactDemoLinks.count()) {
              throw new Error('Duplicate "Demo" navigation item is still visible');
            }
            if (!(await header.getByRole("link", { name: "Demo bekijken" }).count())) {
              throw new Error('"Demo bekijken" CTA is missing');
            }
            console.log("PASS public navigation: only Demo bekijken remains");

            await page.goto(baseURL + "/demo", { waitUntil: "networkidle", timeout: 45000 });
            await page.getByRole("button", { name: "Start demo als sportschool" }).click();
            await page.waitForURL("**/dashboard", { timeout: 60000 });
            await page.goto(baseURL + "/agenda", { waitUntil: "networkidle", timeout: 45000 });

            for (const label of ["Nog iemand zoeken", "Reactie ontvangen", "Bevestigd"]) {
              const count = await page.getByText(label, { exact: true }).count();
              if (!count) throw new Error("Agenda state missing: " + label);
              console.log("PASS agenda state", label, "count=" + count);
            }

            const body = await page.locator("body").innerText();
            if (!body.includes("reactie") && !body.includes("reacties")) {
              throw new Error("Agenda does not surface pending application context");
            }
            console.log("PASS agenda includes pending-reaction context");

            const logout = page.getByRole("button", { name: /uitloggen/i });
            if (await logout.count()) {
              await logout.click();
              await page.waitForURL(/\/$/, { timeout: 30000 });
            }
          } finally {
            await context.close();
            await browser.close();
          }
          EOF
          node live-agenda-check.mjs
