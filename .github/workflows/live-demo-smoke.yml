name: Mobile navigation production check

on:
  push:
    branches:
      - qa/demo-live-check-20260921

jobs:
  mobile-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify mobile navigation on production
        env:
          BASE_URL: https://sportmatch-zzp.vercel.app
        run: |
          cat > mobile-nav-check.mjs <<'EOF'
          import { chromium } from "@playwright/test";

          const browser = await chromium.launch({ headless: true });
          const baseURL = process.env.BASE_URL;

          async function checkRole(role, primaryLabels, moreLabels) {
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
            });
            const page = await context.newPage();

            try {
              await page.goto(baseURL + "/demo", { waitUntil: "networkidle", timeout: 45000 });
              await page.getByRole("button", { name: "Start demo als " + role }).click();
              await page.waitForURL("**/dashboard", { timeout: 60000 });

              const bottomNav = page.locator("nav.fixed.inset-x-0.bottom-0");
              for (const label of primaryLabels) {
                await bottomNav.getByText(label, { exact: true }).waitFor();
              }
              await bottomNav.getByText("Meer", { exact: true }).waitFor();
              console.log("PASS", role, "primary navigation");

              await bottomNav.getByRole("button", { name: "Meer navigatie" }).click();
              const menu = page.getByRole("region", { name: "Meer navigatie" });
              await menu.waitFor();
              console.log("MENU_TEXT", role, JSON.stringify(await menu.innerText()));

              for (const label of moreLabels) {
                const item = menu.getByText(label, { exact: true });
                await item.scrollIntoViewIfNeeded();
                await item.waitFor();
              }
              for (const label of ["Meldingen", "Profiel", "Instellingen", "Uitloggen"]) {
                await menu.getByText(label, { exact: true }).waitFor();
              }
              console.log("PASS", role, "more menu");

              const target = role === "sportschool" ? "Berichten" : "Documenten";
              await menu.getByText(target, { exact: true }).click();
              await page.waitForLoadState("networkidle");
              console.log("PASS", role, "hidden section reachable", page.url());

              const logout = page.getByRole("button", { name: /uitloggen/i }).first();
              if (await logout.count()) {
                await logout.click();
                await page.waitForURL(/\/$/, { timeout: 30000 });
              } else {
                await page.getByRole("button", { name: "Meer navigatie" }).click();
                await page.getByText("Uitloggen", { exact: true }).click();
                await page.waitForURL(/\/$/, { timeout: 30000 });
              }
            } finally {
              await context.close();
            }
          }

          try {
            await checkRole(
              "sportschool",
              ["Dashboard", "Opdrachten", "Kandidaten", "Agenda"],
              ["Berichten", "Statistieken", "Organisatie", "Reviews", "Abonnement"],
            );
            await checkRole(
              "instructeur",
              ["Dashboard", "Opdrachten", "Mijn reacties", "Agenda"],
              ["Berichten", "Beschikbaarheid", "Documenten", "Reviews", "Abonnement"],
            );
          } finally {
            await browser.close();
          }
          EOF
          node mobile-nav-check.mjs
