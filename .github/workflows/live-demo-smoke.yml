name: Live demo concurrency check

on:
  push:
    branches:
      - qa/demo-live-check-20260921

jobs:
  demo-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check concurrent live demos
        env:
          BASE_URL: https://sportmatch-zzp.vercel.app
        run: |
          cat > live-demo-concurrency.mjs <<'EOF'
          import { chromium } from "@playwright/test";

          const browser = await chromium.launch({ headless: true });
          const baseURL = process.env.BASE_URL;

          async function startDemo(context, label) {
            const page = await context.newPage();
            await page.goto(baseURL + "/demo", { waitUntil: "networkidle", timeout: 45000 });
            await page.getByRole("button", { name: "Start demo als " + label }).click();
            await page.waitForURL("**/dashboard", { timeout: 60000 });
            return page;
          }

          const a = await browser.newContext();
          const b = await browser.newContext();

          try {
            const [pageA, pageB] = await Promise.all([
              startDemo(a, "sportschool"),
              startDemo(b, "sportschool"),
            ]);

            const cookiesA = await a.cookies();
            const cookiesB = await b.cookies();
            const demoA = cookiesA.find(c => c.name.includes("demo"));
            const demoB = cookiesB.find(c => c.name.includes("demo"));

            if (!demoA || !demoB) throw new Error("Demo session cookie missing");
            if (demoA.value === demoB.value) throw new Error("Concurrent demos share the same session id");

            const logoutA = pageA.getByRole("button", { name: /uitloggen/i });
            if (await logoutA.count()) {
              await logoutA.click();
            }

            await pageB.goto(baseURL + "/dashboard", { waitUntil: "networkidle", timeout: 45000 });
            if (!pageB.url().includes("/dashboard")) {
              throw new Error("Logging out demo A affected demo B");
            }

            const logoutB = pageB.getByRole("button", { name: /uitloggen/i });
            if (await logoutB.count()) {
              await logoutB.click();
            }

            console.log("PASS concurrent isolation");
            console.log("PASS logout A leaves B active");
            console.log("PASS both sessions used unique demo cookies");
          } finally {
            await a.close();
            await b.close();
            await browser.close();
          }
          EOF
          node live-demo-concurrency.mjs
