name: Demo startup timing check

on:
  push:
    branches:
      - qa/demo-live-check-20260921

jobs:
  demo-timing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Measure live demo startup
        env:
          BASE_URL: https://sportmatch-f57jxkcgn-maxcrijnen-alts-projects.vercel.app
        run: |
          cat > demo-timing.mjs <<'EOF'
          import { chromium } from "@playwright/test";

          const browser = await chromium.launch({ headless: true });
          const baseURL = process.env.BASE_URL;

          async function measure(role) {
            const context = await browser.newContext();
            const page = await context.newPage();
            try {
              const navStart = Date.now();
              await page.goto(baseURL + "/demo", { waitUntil: "networkidle", timeout: 45000 });
              const pageLoadMs = Date.now() - navStart;

              const button = page.getByRole("button", { name: "Start demo als " + role });
              const start = Date.now();
              await button.click();
              await page.waitForURL("**/dashboard", { timeout: 90000 });
              const startupMs = Date.now() - start;

              console.log("TIMING", JSON.stringify({ role, pageLoadMs, startupMs, totalMs: pageLoadMs + startupMs }));

              const logout = page.getByRole("button", { name: /uitloggen/i }).first();
              await logout.click();
              await page.waitForURL(/\/$/, { timeout: 30000 });
            } finally {
              await context.close();
            }
          }

          try {
            await measure("sportschool");
            await measure("instructeur");
          } finally {
            await browser.close();
          }
          EOF
          node demo-timing.mjs
