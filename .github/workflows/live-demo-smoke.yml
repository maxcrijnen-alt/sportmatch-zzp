name: Candidate profile production check

on:
  push:
    branches:
      - qa/demo-live-check-20260921

jobs:
  candidate-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify candidate profile on production
        env:
          BASE_URL: https://sportmatch-zzp.vercel.app
        run: |
          cat > candidate-profile-check.mjs <<'EOF'
          import { chromium } from "@playwright/test";

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext();
          const page = await context.newPage();
          const baseURL = process.env.BASE_URL;

          try {
            await page.goto(baseURL + "/demo", { waitUntil: "networkidle", timeout: 45000 });
            await page.getByRole("button", { name: "Start demo als sportschool" }).click();
            await page.waitForURL("**/dashboard", { timeout: 60000 });

            await page.goto(baseURL + "/organisatie/opdrachten", {
              waitUntil: "networkidle",
              timeout: 45000,
            });
            const reactions = page.getByRole("link", { name: /\d+ bekijken/ }).first();
            await reactions.waitFor();
            await reactions.click();
            await page.waitForURL((url) =>
              url.pathname === "/organisatie/kandidaten" && Boolean(url.searchParams.get("job")),
              { timeout: 30000 },
            );
            const jobId = new URL(page.url()).searchParams.get("job");

            const profileLink = page.locator('a[href^="/organisatie/kandidaten/"]').first();
            await profileLink.waitFor();
            const profileHref = await profileLink.getAttribute("href");
            if (!profileHref || !profileHref.includes(`job=${jobId}`)) {
              throw new Error("Candidate profile link did not preserve job context");
            }
            console.log("PASS candidate profile link", profileHref);

            await profileLink.click();
            await page.waitForURL((url) =>
              url.pathname.startsWith("/organisatie/kandidaten/") &&
              url.searchParams.get("job") === jobId,
              { timeout: 30000 },
            );

            for (const heading of ["Over mij", "Reviews", "Sporten & lesvormen", "Diploma’s"]) {
              await page.getByRole("heading", { name: heading, exact: true }).waitFor();
            }
            await page.getByText("Beoordeling", { exact: true }).waitFor();
            await page.getByText("Betrouwbaarheid", { exact: true }).waitFor();
            await page.getByText("Reisafstand", { exact: true }).waitFor();
            console.log("PASS candidate profile content", page.url());

            for (const sensitive of ["E-mail", "Telefoon", "KvK-nummer", "Btw-nummer"]) {
              if (await page.getByText(sensitive, { exact: true }).count()) {
                throw new Error("Sensitive candidate field visible: " + sensitive);
              }
            }
            console.log("PASS no sensitive candidate contact fields");

            const back = page.getByRole("link", { name: "← Terug naar kandidaten" });
            const backHref = await back.getAttribute("href");
            if (!backHref || !backHref.includes(`job=${jobId}`)) {
              throw new Error("Back link did not preserve candidate context");
            }
            await back.click();
            await page.waitForURL((url) =>
              url.pathname === "/organisatie/kandidaten" &&
              url.searchParams.get("job") === jobId,
              { timeout: 30000 },
            );
            console.log("PASS candidate context restored");

            const logout = page.getByRole("button", { name: /uitloggen/i }).first();
            await logout.click();
            await page.waitForURL((url) => url.pathname === "/", { timeout: 30000 });
            console.log("PASS sportschool demo logout");
          } finally {
            await context.close();
            await browser.close();
          }
          EOF
          node candidate-profile-check.mjs
