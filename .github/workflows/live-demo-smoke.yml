name: Instructor assignment CTA production check

on:
  push:
    branches:
      - qa/demo-live-check-20260921

jobs:
  assignment-cta:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify instructor assignment CTA on production
        env:
          BASE_URL: https://sportmatch-zzp.vercel.app
        run: |
          cat > instructor-assignment-cta.mjs <<'EOF'
          import { chromium } from "@playwright/test";

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext();
          const page = await context.newPage();
          const baseURL = process.env.BASE_URL;

          try {
            await page.goto(baseURL + "/demo", { waitUntil: "networkidle", timeout: 45000 });
            await page.getByRole("button", { name: "Start demo als instructeur" }).click();
            await page.waitForURL("**/dashboard", { timeout: 60000 });

            await page.goto(baseURL + "/opdrachten", { waitUntil: "networkidle", timeout: 45000 });

            const applyLinks = page.getByRole("link", { name: "Aanmelden", exact: true });
            if ((await applyLinks.count()) < 1) {
              throw new Error("No Aanmelden CTA found on instructor assignments");
            }
            console.log("PASS Aanmelden CTA visible", await applyLinks.count());

            const applyHref = await applyLinks.first().getAttribute("href");
            if (!applyHref || !applyHref.includes("#aanmelden")) {
              throw new Error("Aanmelden CTA does not link to application form anchor");
            }

            await applyLinks.first().click();
            await page.waitForURL((url) =>
              url.pathname.startsWith("/opdrachten/") && url.hash === "#aanmelden",
              { timeout: 30000 },
            );
            await page.getByRole("heading", { name: "Reageren op deze opdracht", exact: true }).waitFor();
            console.log("PASS Aanmelden opens existing application form");

            await page.goto(baseURL + "/opdrachten", { waitUntil: "networkidle", timeout: 45000 });
            const existing = page.getByRole("link", { name: "Reactie bekijken", exact: true });
            if ((await existing.count()) < 1) {
              throw new Error("No Reactie bekijken CTA found for existing application");
            }
            const existingHref = await existing.first().getAttribute("href");
            if (!existingHref || existingHref.includes("#aanmelden")) {
              throw new Error("Reactie bekijken should open the assignment, not the application anchor");
            }
            console.log("PASS existing application CTA visible");

            const overflow = await page.evaluate(() => ({
              scrollWidth: document.documentElement.scrollWidth,
              clientWidth: document.documentElement.clientWidth,
            }));
            if (overflow.scrollWidth > overflow.clientWidth + 2) {
              throw new Error("Assignment page overflows horizontally");
            }
            console.log("PASS no horizontal overflow");

            const logout = page.getByRole("button", { name: /uitloggen/i }).first();
            await logout.click();
            await page.waitForURL((url) => url.pathname === "/", { timeout: 30000 });
            console.log("PASS instructor demo logout");
          } finally {
            await context.close();
            await browser.close();
          }
          EOF
          node instructor-assignment-cta.mjs
