name: Sportschool dashboard production check

on:
  push:
    branches:
      - qa/demo-live-check-20260921

jobs:
  organization-dashboard-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify sportschool action dashboard on production
        env:
          BASE_URL: https://sportmatch-zzp.vercel.app
        run: |
          cat > organization-dashboard-check.mjs <<'EOF'
          import { chromium } from "@playwright/test";

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext();
          const page = await context.newPage();
          const baseURL = process.env.BASE_URL;

          try {
            await page.goto(baseURL + "/demo", { waitUntil: "networkidle", timeout: 45000 });
            await page.getByRole("button", { name: "Start demo als sportschool" }).click();
            await page.waitForURL("**/dashboard", { timeout: 60000 });

            const main = page.locator("main");
            for (const label of [
              "Nog iemand zoeken",
              "Reacties te beoordelen",
              "Wacht op bevestiging",
            ]) {
              await main.getByText(label, { exact: true }).waitFor();
              console.log("PASS dashboard state", label);
            }

            const oldExplainer = main.getByText("Start hier als sportschool", { exact: true });
            if (await oldExplainer.count()) {
              throw new Error("Old onboarding-style dashboard explainer is still visible");
            }

            await main.getByText("Wat vraagt aandacht?", { exact: true }).waitFor();
            const counts = {};
            for (const label of [
              "Nog iemand zoeken",
              "Reacties te beoordelen",
              "Wacht op bevestiging",
            ]) {
              const card = main.getByText(label, { exact: true }).locator("..");
              counts[label] = await card.locator("p").nth(1).innerText();
            }
            console.log("COUNTS", JSON.stringify(counts));

            const primaryButtons = main.getByRole("button");
            if (!(await primaryButtons.count())) {
              throw new Error("Dashboard has no primary action button");
            }
            console.log("PASS dashboard has contextual primary action");

            const logout = page.getByRole("button", { name: /uitloggen/i }).first();
            await logout.click();
            await page.waitForURL(/\/$/, { timeout: 30000 });
            console.log("PASS sportschool demo logout");
          } finally {
            await context.close();
            await browser.close();
          }
          EOF
          node organization-dashboard-check.mjs
