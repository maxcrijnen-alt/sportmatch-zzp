name: Sportschool UX audit

on:
  push:
    branches:
      - qa/demo-live-check-20260921

jobs:
  ux-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Audit live sportschool demo
        env:
          BASE_URL: https://sportmatch-zzp.vercel.app
        run: |
          cat > ux-audit.mjs <<'EOF'
          import { chromium } from "@playwright/test";

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
          const page = await context.newPage();
          const baseURL = process.env.BASE_URL;

          function clean(text) {
            return text.replace(/\s+/g, " ").trim();
          }

          async function audit(path, label) {
            await page.goto(baseURL + path, { waitUntil: "networkidle", timeout: 45000 });
            const headings = await page.locator("h1,h2").allTextContents();
            const buttons = await page.getByRole("button").allTextContents();
            const links = await page.getByRole("link").allTextContents();
            const body = clean(await page.locator("main").innerText().catch(() => ""));
            console.log("\n=== " + label + " " + page.url() + " ===");
            console.log("HEADINGS:", headings.map(clean).filter(Boolean).slice(0,12));
            console.log("BUTTONS:", buttons.map(clean).filter(Boolean).slice(0,20));
            console.log("LINKS:", links.map(clean).filter(Boolean).slice(0,20));
            console.log("BODY:", body.slice(0,3500));
          }

          try {
            await page.goto(baseURL + "/demo", { waitUntil: "networkidle", timeout: 45000 });
            await page.getByRole("button", { name: "Start demo als sportschool" }).click();
            await page.waitForURL("**/dashboard", { timeout: 60000 });

            const pages = [
              ["/dashboard", "Dashboard"],
              ["/organisatie/opdrachten", "Opdrachten"],
              ["/organisatie/opdrachten/nieuw", "Nieuwe opdracht"],
              ["/organisatie/kandidaten", "Kandidaten"],
              ["/agenda", "Agenda"],
              ["/berichten", "Berichten"],
              ["/meldingen", "Meldingen"],
              ["/reviews", "Reviews"],
              ["/organisatie", "Organisatie"],
              ["/abonnement", "Abonnement"],
              ["/instellingen", "Instellingen"],
            ];

            for (const [path, label] of pages) {
              await audit(path, label);
            }

            const logout = page.getByRole("button", { name: /uitloggen/i });
            if (await logout.count()) {
              await logout.click();
              await page.waitForURL(/\/$/, { timeout: 30000 });
            }
          } finally {
            await context.close();
            await browser.close();
          }
          EOF
          node ux-audit.mjs
