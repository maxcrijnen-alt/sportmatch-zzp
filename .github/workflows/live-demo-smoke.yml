name: Production jobs overview check

on:
  push:
    branches:
      - qa/demo-live-check-20260921

jobs:
  preview-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify production assignment overview
        env:
          BASE_URL: https://sportmatch-zzp.vercel.app
        run: |
          cat > preview-jobs-check.mjs <<'EOF'
          import { chromium } from "@playwright/test";

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext();
          const page = await context.newPage();
          const baseURL = process.env.BASE_URL;

          try {
            await page.goto(baseURL + "/demo", { waitUntil: "networkidle", timeout: 45000 });
            await page.getByRole("button", { name: "Start demo als sportschool" }).click();
            await page.waitForURL("**/dashboard", { timeout: 60000 });
            await page.goto(baseURL + "/organisatie/opdrachten", { waitUntil: "networkidle", timeout: 45000 });

            const body = await page.locator("main").innerText();
            if (!body.includes("Bootcamp gezocht")) throw new Error("Expected demo assignments are missing");
            for (const label of ["Wacht op bevestiging", "Reacties bekijken", "Nog zoeken", "Bevestigd"]) {
              if (!body.includes(label)) throw new Error("Missing workflow label: " + label);
              console.log("PASS", label);
            }
            console.log("PASS jobs overview contains demo assignments");

            const logout = page.getByRole("button", { name: /uitloggen/i }).first();
            await logout.click();
            await page.waitForURL(/\/$/, { timeout: 30000 });
          } finally {
            await context.close();
            await browser.close();
          }
          EOF
          node preview-jobs-check.mjs
