name: Candidate list clarity production check

on:
  push:
    branches:
      - qa/demo-live-check-20260921

jobs:
  candidate-list:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify candidate list clarity on production
        env:
          BASE_URL: https://sportmatch-zzp.vercel.app
        run: |
          cat > candidate-list-check.mjs <<'EOF'
          import { chromium } from "@playwright/test";

          const browser = await chromium.launch({ headless: true });
          const baseURL = process.env.BASE_URL;

          async function startSportschool(context) {
            const page = await context.newPage();
            await page.goto(baseURL + "/demo", { waitUntil: "networkidle", timeout: 45000 });
            await page.getByRole("button", { name: "Start demo als sportschool" }).click();
            await page.waitForURL("**/dashboard", { timeout: 60000 });
            return page;
          }

          try {
            const desktop = await browser.newContext({ viewport: { width: 1280, height: 900 } });
            const page = await startSportschool(desktop);
            await page.goto(baseURL + "/organisatie/kandidaten", {
              waitUntil: "networkidle",
              timeout: 45000,
            });

            const headings = [
              "Reacties",
              "Eerder mee samengewerkt",
              "Passende instructeurs",
              "Hoog beoordeeld",
            ];
            for (const heading of headings) {
              await page.getByRole("heading", { name: heading, exact: true }).waitFor();
            }
            console.log("PASS clear candidate sections");

            if (await page.getByText("Zo kies je sneller de juiste instructeur", { exact: true }).count()) {
              throw new Error("Old explanatory candidate tip card is still visible");
            }
            console.log("PASS explanatory card removed");

            const profileLink = page.locator('a[href^="/organisatie/kandidaten/"]').first();
            await profileLink.waitFor();
            const candidateRow = profileLink.locator("xpath=ancestor::div[contains(@class,'px-5')][1]");
            const rowText = await candidateRow.innerText();
            if (!rowText.includes("reviews") || !rowText.includes("Betrouwbaarheid")) {
              throw new Error("Candidate core review/reliability information is not grouped under the candidate");
            }
            console.log("PASS candidate summary line", JSON.stringify(rowText));

            await desktop.close();

            const mobile = await browser.newContext({ viewport: { width: 390, height: 844 } });
            const mobilePage = await startSportschool(mobile);
            await mobilePage.goto(baseURL + "/organisatie/kandidaten", {
              waitUntil: "networkidle",
              timeout: 45000,
            });
            await mobilePage.getByRole("heading", { name: "Reacties", exact: true }).waitFor();

            const overflow = await mobilePage.evaluate(() => ({
              scrollWidth: document.documentElement.scrollWidth,
              clientWidth: document.documentElement.clientWidth,
            }));
            if (overflow.scrollWidth > overflow.clientWidth + 2) {
              throw new Error(`Mobile candidate page overflows horizontally: ${JSON.stringify(overflow)}`);
            }
            console.log("PASS mobile no horizontal overflow", JSON.stringify(overflow));

            const mobileProfile = mobilePage.getByRole("button", { name: "Profiel", exact: true }).first();
            if (await mobileProfile.count()) {
              await mobileProfile.waitFor();
              console.log("PASS mobile candidate actions visible");
            }

            const logout = mobilePage.getByRole("button", { name: /uitloggen/i }).first();
            await logout.click();
            await mobilePage.waitForURL((url) => url.pathname === "/", { timeout: 30000 });
            console.log("PASS sportschool demo logout");
            await mobile.close();
          } finally {
            await browser.close();
          }
          EOF
          node candidate-list-check.mjs
