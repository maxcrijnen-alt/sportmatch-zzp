name: Sportschool urgency production check

on:
  push:
    branches:
      - qa/demo-live-check-20260921

jobs:
  urgency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify sportschool urgency on production
        env:
          BASE_URL: https://sportmatch-zzp.vercel.app
        run: |
          cat > urgency-check.mjs <<'EOF'
          import { chromium } from "@playwright/test";

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext();
          const page = await context.newPage();
          const baseURL = process.env.BASE_URL;

          try {
            await page.goto(baseURL + "/demo", { waitUntil: "networkidle", timeout: 45000 });
            await page.getByRole("button", { name: "Start demo als sportschool" }).click();
            await page.waitForURL("**/dashboard", { timeout: 60000 });

            const main = page.locator("main");
            const urgencyHeading = main.getByRole("heading", { name: "Urgentie", exact: true });
            await urgencyHeading.waitFor();

            const section = urgencyHeading.locator("..").locator("..");
            const text = await section.innerText();
            console.log("URGENCY_TEXT", JSON.stringify(text));

            const jobLinks = section.locator('a[href^="/organisatie/opdrachten/"]');
            const count = await jobLinks.count();
            if (count < 1) {
              throw new Error("Demo has no urgent assignment links");
            }

            const firstHref = await jobLinks.first().getAttribute("href");
            if (!firstHref) throw new Error("Urgent assignment link has no href");
            console.log("PASS urgency links", count, firstHref);

            await jobLinks.first().click();
            await page.waitForURL((url) => url.pathname === firstHref, { timeout: 30000 });
            console.log("PASS urgent assignment opens", page.url());

            const logout = page.getByRole("button", { name: /uitloggen/i }).first();
            await logout.click();
            await page.waitForURL((url) => url.pathname === "/", { timeout: 30000 });
            console.log("PASS sportschool demo logout");
          } finally {
            await context.close();
            await browser.close();
          }
          EOF
          node urgency-check.mjs
