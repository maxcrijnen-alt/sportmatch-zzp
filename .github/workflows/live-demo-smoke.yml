name: Instructor UX production check

on:
  push:
    branches:
      - qa/demo-live-check-20260921

jobs:
  instructor-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify instructor UX on production
        env:
          BASE_URL: https://sportmatch-zzp.vercel.app
        run: |
          cat > instructor-ux-check.mjs <<'EOF'
          import { chromium } from "@playwright/test";

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext();
          const page = await context.newPage();
          const baseURL = process.env.BASE_URL;

          try {
            await page.goto(baseURL + "/demo", { waitUntil: "networkidle", timeout: 45000 });
            await page.getByRole("button", { name: "Start demo als instructeur" }).click();
            await page.waitForURL("**/dashboard", { timeout: 60000 });

            const dashboard = await page.locator("main").innerText();
            if (dashboard.includes("Vind je volgende opdracht")) {
              throw new Error("Duplicate instructor dashboard card is still visible");
            }
            if (!dashboard.includes("Opdrachten bekijken")) {
              throw new Error("Primary instructor jobs CTA is missing");
            }
            console.log("PASS instructor dashboard CTA hierarchy");

            await page.goto(baseURL + "/profiel", { waitUntil: "networkidle", timeout: 45000 });

            await page.getByRole("button", { name: "Persoonlijke gegevens opslaan" }).waitFor();
            await page.getByRole("button", { name: "Instructeursprofiel opslaan" }).waitFor();

            const genericSave = page.getByRole("button", { name: /^Opslaan$/ });
            if (await genericSave.count()) {
              throw new Error("Generic profile save buttons are still visible");
            }

            console.log("PASS instructor profile save actions are explicit");

            const logout = page.getByRole("button", { name: /uitloggen/i }).first();
            await logout.click();
            await page.waitForURL(/\/$/, { timeout: 30000 });
            console.log("PASS instructor demo logout");
          } finally {
            await context.close();
            await browser.close();
          }
          EOF
          node instructor-ux-check.mjs
