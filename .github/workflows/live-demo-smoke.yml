name: Assignment candidate filter production check

on:
  push:
    branches:
      - qa/demo-live-check-20260921

jobs:
  candidate-filter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify assignment reactions link on production
        env:
          BASE_URL: https://sportmatch-zzp.vercel.app
        run: |
          cat > candidate-filter-check.mjs <<'EOF'
          import { chromium } from "@playwright/test";

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext();
          const page = await context.newPage();
          const baseURL = process.env.BASE_URL;

          try {
            await page.goto(baseURL + "/demo", { waitUntil: "networkidle", timeout: 45000 });
            await page.getByRole("button", { name: "Start demo als sportschool" }).click();
            await page.waitForURL("**/dashboard", { timeout: 60000 });

            await page.goto(baseURL + "/organisatie/opdrachten", {
              waitUntil: "networkidle",
              timeout: 45000,
            });

            const reactionLink = page.getByRole("link", { name: /\d+ bekijken/ }).first();
            await reactionLink.waitFor();
            const href = await reactionLink.getAttribute("href");
            if (!href || !href.includes("/organisatie/kandidaten?job=")) {
              throw new Error("Reaction count does not link to filtered candidates");
            }
            console.log("PASS reaction link", href);

            const expectedJobId = new URL(href, baseURL).searchParams.get("job");
            await reactionLink.click();
            await page.waitForURL((url) =>
              url.pathname === "/organisatie/kandidaten" &&
              url.searchParams.get("job") === expectedJobId,
              { timeout: 30000 },
            );

            await page.getByRole("heading", { name: /^Kandidaten · / }).waitFor();
            await page.getByRole("link", { name: "Alle kandidaten" }).waitFor();
            console.log("PASS filtered candidates page", page.url());

            const logout = page.getByRole("button", { name: /uitloggen/i }).first();
            await logout.click();
            await page.waitForURL((url) => url.pathname === "/", { timeout: 30000 });
            console.log("PASS sportschool demo logout");
          } finally {
            await context.close();
            await browser.close();
          }
          EOF
          node candidate-filter-check.mjs
