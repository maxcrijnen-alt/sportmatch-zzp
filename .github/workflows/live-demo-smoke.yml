name: Instructor dashboard production check

on:
  push:
    branches:
      - qa/demo-live-check-20260921

jobs:
  instructor-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify instructor action dashboard on production
        env:
          BASE_URL: https://sportmatch-zzp.vercel.app
        run: |
          cat > instructor-dashboard-check.mjs <<'EOF'
          import { chromium } from "@playwright/test";

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext();
          const page = await context.newPage();
          const baseURL = process.env.BASE_URL;

          try {
            await page.goto(baseURL + "/demo", { waitUntil: "networkidle", timeout: 45000 });
            await page.getByRole("button", { name: "Start demo als instructeur" }).click();
            await page.waitForURL("**/dashboard", { timeout: 60000 });

            const main = page.locator("main");
            for (const label of [
              "Uitnodigingen",
              "Open reacties",
              "Wacht op jouw bevestiging",
              "Eerstvolgende bevestigde klus",
              "Profiel & VOG",
            ]) {
              await main.getByText(label, { exact: true }).waitFor();
              console.log("PASS dashboard item", label);
            }

            const oldExplainer = main.getByText("Start hier als instructeur", { exact: true });
            if (await oldExplainer.count()) {
              throw new Error("Old instructor explainer is still visible");
            }

            await main.getByText("Wat vraagt aandacht?", { exact: true }).waitFor();
            console.log("PASS action-focused instructor dashboard");

            const counts = {};
            for (const label of ["Uitnodigingen", "Open reacties", "Wacht op jouw bevestiging"]) {
              const card = main.getByText(label, { exact: true }).locator("..");
              counts[label] = await card.locator("p").nth(1).innerText();
            }
            console.log("COUNTS", JSON.stringify(counts));

            const primaryLink = main.locator("section").first().getByRole("link").first();
            console.log("PRIMARY_HREF", await primaryLink.getAttribute("href"));

            const logout = page.getByRole("button", { name: /uitloggen/i }).first();
            await logout.click();
            await page.waitForURL((url) => url.pathname === "/", { timeout: 30000 });
            console.log("PASS instructor demo logout");
          } finally {
            await context.close();
            await browser.close();
          }
          EOF
          node instructor-dashboard-check.mjs
