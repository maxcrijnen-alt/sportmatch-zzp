name: Review tabs production check

on:
  push:
    branches:
      - qa/demo-live-check-20260921

jobs:
  review-tabs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify review tabs on production
        env:
          BASE_URL: https://sportmatch-zzp.vercel.app
        run: |
          cat > review-tabs-check.mjs <<'EOF'
          import { chromium } from "@playwright/test";

          const browser = await chromium.launch({ headless: true });
          const baseURL = process.env.BASE_URL;

          async function check(role, reviewsPath) {
            const context = await browser.newContext();
            const page = await context.newPage();
            try {
              await page.goto(baseURL + "/demo", { waitUntil: "networkidle", timeout: 45000 });
              await page.getByRole("button", { name: "Start demo als " + role }).click();
              await page.waitForURL("**/dashboard", { timeout: 60000 });

              await page.goto(baseURL + reviewsPath, { waitUntil: "networkidle", timeout: 45000 });

              const receivedTab = page.getByRole("link", { name: /^Ontvangen \(/ });
              const givenTab = page.getByRole("link", { name: /^Gegeven \(/ });
              await receivedTab.waitFor();
              await givenTab.waitFor();
              await page.getByRole("heading", { name: "Ontvangen beoordelingen", exact: true }).waitFor();
              console.log("PASS", role, "received tab", await receivedTab.innerText());

              await givenTab.click();
              await page.waitForURL((url) =>
                url.pathname === reviewsPath && url.searchParams.get("view") === "given",
                { timeout: 30000 },
              );
              await page.getByRole("heading", { name: "Gegeven beoordelingen", exact: true }).waitFor();
              console.log("PASS", role, "given tab", page.url());

              const logout = page.getByRole("button", { name: /uitloggen/i }).first();
              await logout.click();
              await page.waitForURL((url) => url.pathname === "/", { timeout: 30000 });
            } finally {
              await context.close();
            }
          }

          try {
            await check("sportschool", "/organisatie/reviews");
            await check("instructeur", "/reviews");
          } finally {
            await browser.close();
          }
          EOF
          node review-tabs-check.mjs
