name: Agenda status indicator production check

on:
  push:
    branches:
      - qa/demo-live-check-20260921

jobs:
  agenda-status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify visual agenda states on production
        env:
          BASE_URL: https://sportmatch-zzp.vercel.app
        run: |
          cat > agenda-status-check.mjs <<'EOF'
          import { chromium } from "@playwright/test";

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext();
          const page = await context.newPage();
          const baseURL = process.env.BASE_URL;

          try {
            await page.goto(baseURL + "/demo", { waitUntil: "networkidle", timeout: 45000 });
            await page.getByRole("button", { name: "Start demo als sportschool" }).click();
            await page.waitForURL("**/dashboard", { timeout: 60000 });

            await page.goto(baseURL + "/agenda", { waitUntil: "networkidle", timeout: 45000 });

            const expected = [
              ["Nog iemand zoeken", "red-"],
              ["Reactie ontvangen", "amber-"],
              ["Wacht op bevestiging", "amber-"],
              ["Bevestigd", "emerald-"],
            ];

            for (const [label, tone] of expected) {
              const indicator = page.locator(`[aria-label="${label}"]`).first();
              await indicator.waitFor();
              const square = indicator.locator("span").first();
              const classes = await square.getAttribute("class");
              if (!classes?.includes(tone)) {
                throw new Error(`${label} has unexpected tone: ${classes}`);
              }
              console.log("PASS list status", label, tone);
            }

            await page.getByRole("button", { name: "Week", exact: true }).click();
            const compactIndicators = page.locator(
              '[aria-label="Nog iemand zoeken"], [aria-label="Reactie ontvangen"], [aria-label="Wacht op bevestiging"], [aria-label="Bevestigd"]',
            );
            if ((await compactIndicators.count()) < 1) {
              throw new Error("No compact status indicators found in week view");
            }
            console.log("PASS week compact indicators", await compactIndicators.count());

            const logout = page.getByRole("button", { name: /uitloggen/i }).first();
            await logout.click();
            await page.waitForURL((url) => url.pathname === "/", { timeout: 30000 });
            console.log("PASS sportschool demo logout");
          } finally {
            await context.close();
            await browser.close();
          }
          EOF
          node agenda-status-check.mjs
