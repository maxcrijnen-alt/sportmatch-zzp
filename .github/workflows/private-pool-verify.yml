name: Temporary private pool verification
on:
  push:
    branches:
      - feature/private-instructor-pool
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
        continue-on-error: true
      - name: Lint changed TypeScript files
        run: |
          npx eslint \
            "src/app/(app)/organisatie/kandidaten/page.tsx" \
            "src/app/(app)/organisatie/kandidaten/[id]/page.tsx" \
            "src/app/(app)/organisatie/opdrachten/[id]/page.tsx" \
            src/components/jobs/pool-invite-form.tsx \
            src/components/org/connection-button.tsx \
            src/lib/jobs/actions.ts \
            src/lib/org/connections.ts \
            src/types/database.ts \
            tests/flows.spec.ts
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test
      - run: sudo systemctl start postgresql
      - run: npm run test:db
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test
