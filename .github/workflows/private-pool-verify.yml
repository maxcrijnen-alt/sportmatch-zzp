name: Temporary private pool verification

on:
  push:
    branches:
      - feature/private-instructor-pool
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Full lint (known baseline issues allowed)
        run: npm run lint
        continue-on-error: true

      - name: Lint changed TypeScript files
        run: |
          npx eslint \
            "src/app/(app)/organisatie/kandidaten/page.tsx" \
            "src/app/(app)/organisatie/kandidaten/[id]/page.tsx" \
            "src/app/(app)/organisatie/opdrachten/[id]/page.tsx" \
            src/components/jobs/pool-invite-form.tsx \
            src/components/org/connection-button.tsx \
            src/lib/jobs/actions.ts \
            src/lib/org/connections.ts \
            src/types/database.ts \
            tests/flows.spec.ts \
            tests/public.spec.ts

      - name: Run database smoke tests
        run: |
          sudo systemctl start postgresql
          npm run test:db

      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Start isolated Supabase
        run: supabase start

      - name: Export local Supabase environment
        run: |
          eval "$(supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"

      - name: Build against isolated Supabase
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run public and demo E2E
        run: npm run test:e2e
        env:
          RUN_DEMO_E2E: "true"

      - name: Stop isolated Supabase
        if: always()
        run: command -v supabase >/dev/null && supabase stop --no-backup || true
